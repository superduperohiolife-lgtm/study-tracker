<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>勉強で稼ぐ</title>
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --card2:#273549; --line:#334155;
  --tx:#e2e8f0; --tx2:#94a3b8; --tx3:#64748b;
  --yume:#f472b6; --yuki:#38bdf8;
  --ok:#34d399; --warn:#fbbf24; --ng:#f87171;
  --safeb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:"Meiryo UI","Meiryo",Calibri,system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.6;
  padding-bottom:calc(64px + var(--safeb));
}
.wrap{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:0}
h2{font-size:15px;margin:0 0 10px;color:var(--tx2);font-weight:600}
.hd{display:flex;align-items:center;gap:8px;padding:10px 12px;position:sticky;top:0;background:rgba(15,23,42,.94);backdrop-filter:blur(8px);z-index:20;border-bottom:1px solid var(--line)}
.hd .sub{font-size:11px;color:var(--tx3);margin-top:1px}
.psel{width:auto!important;background:var(--card2);border:1px solid var(--line);color:var(--tx2);font-size:11px!important;padding:2px 6px!important;border-radius:7px;margin-top:2px;max-width:100%}
.pill{margin-left:auto;font-size:11px;padding:4px 9px;border-radius:999px;background:var(--card2);color:var(--tx2);white-space:nowrap;border:1px solid var(--line);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.kid{border-left:4px solid var(--c)}
.kidhd{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.kidname{font-size:17px;font-weight:700;color:var(--c)}
.kidgrade{font-size:11px;color:var(--tx3);background:var(--card2);padding:1px 7px;border-radius:999px}
.total{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.total small{font-size:14px;font-weight:600;color:var(--tx2);margin-left:3px}
.tsub{font-size:11px;color:var(--tx3);margin-top:2px}
.brk{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.brow{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.brow .lb{color:var(--tx2);min-width:78px}
.brow .vl{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.brow .cap{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:3px}
.bar>i{display:block;height:100%;border-radius:3px;transition:width .35s}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini div{background:var(--card2);border-radius:9px;padding:7px 8px}
.mini b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.mini span{font-size:10px;color:var(--tx3)}
.next{margin-top:10px;background:linear-gradient(90deg,rgba(52,211,153,.14),transparent);border:1px solid rgba(52,211,153,.28);border-radius:9px;padding:8px 10px;font-size:12.5px}
.next b{color:var(--ok);font-size:15px;font-variant-numeric:tabular-nums}
label{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
input,select,textarea,button{font-family:inherit;font-size:15px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:9px 10px}
input:focus,textarea:focus{outline:none;border-color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{margin-bottom:10px}
.pre{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pre button{flex:1;min-width:40px;background:var(--card2);border:1px solid var(--line);color:var(--tx2);border-radius:7px;padding:5px 0;font-size:12px;cursor:pointer}
.pre button:active{background:var(--line)}
.btn{width:100%;background:var(--ok);color:#052e20;border:none;border-radius:10px;padding:12px;font-weight:700;font-size:15px;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--tx2);border:1px solid var(--line);font-weight:600}
.btn.dgr{background:transparent;color:var(--ng);border:1px solid var(--ng)}
.btn+.btn{margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--tx3);font-weight:600;font-size:11px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.we td{background:rgba(56,189,248,.05)}
tr.today td{background:rgba(52,211,153,.09)}
.act{color:var(--tx3);cursor:pointer;font-size:11px;padding:0 3px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(15,23,42,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:var(--safeb);z-index:30}
.tabs button{flex:1;background:none;border:none;color:var(--tx3);padding:11px 0 9px;font-size:11px;cursor:pointer}
.tabs button.on{color:var(--ok)}
.tabs button i{display:block;font-size:18px;font-style:normal;margin-bottom:1px}
.page{display:none}.page.on{display:block}
details{margin-top:10px}
summary{cursor:pointer;font-size:12px;color:var(--tx3);padding:5px 0}
.note{font-size:11.5px;color:var(--tx3);line-height:1.65}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;background:var(--card2);color:var(--tx3);margin-left:5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:340px;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safeb));background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-size:12.5px;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
svg{display:block}
</style>
</head>
<body>

<div class="hd">
  <div>
    <h1>勉強で稼ぐ</h1>
    <select class="psel" id="selP" onchange="changePeriod(+this.value)"></select>
  </div>
  <div class="pill" id="pill" onclick="resync()">⚙️ 未接続</div>
</div>

<!-- ============ 実績 ============ -->
<div class="page on" id="pgHome"><div class="wrap">

  <div id="cards"></div>

  <div class="card">
    <h2>記録する</h2>
    <div class="fld">
      <label>日付</label>
      <input type="date" id="fDate">
    </div>
    <div class="grid2">
      <div class="fld">
        <label><span style="color:var(--yume)">●</span> 結愛 の勉強時間</label>
        <input type="number" id="fYume" step="0.25" min="0" max="8" placeholder="0">
        <div class="pre" id="preYume"></div>
      </div>
      <div class="fld">
        <label><span style="color:var(--yuki)">●</span> 結輝 の勉強時間</label>
        <input type="number" id="fYuki" step="0.25" min="0" max="8" placeholder="0">
        <div class="pre" id="preYuki"></div>
      </div>
    </div>
    <div class="fld">
      <label>メモ（任意）</label>
      <input type="text" id="fMemo" placeholder="数学ワーク／英単語 など">
    </div>
    <button class="btn" onclick="save()">保存する</button>
    <div class="note" style="margin-top:8px" id="inputNote"></div>
  </div>

  <div class="card">
    <h2>日別 勉強時間</h2>
    <div class="scroll" id="chartBar"></div>
  </div>

  <div class="card">
    <h2>累計 支給見込み額</h2>
    <div id="chartLine"></div>
  </div>

  <div class="card">
    <h2>記録一覧</h2>
    <div class="scroll"><table id="tbl"></table></div>
  </div>

  <div class="card">
    <h2>共有設定</h2>
    <details>
      <summary>クラウド同期（Apps Script /exec URL）</summary>
      <div class="fld" style="margin-top:8px">
        <input type="url" id="fApi" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <button class="btn sec" onclick="connect()">接続して同期</button>
      <button class="btn sec" onclick="exportJson()">JSON書き出し</button>
      <button class="btn dgr" onclick="askReset()">全データ削除（旧チャレンジの精算済みデータを消す）</button>
      <div class="note" style="margin-top:8px">正本はスプレッドシート。端末には表示用のキャッシュだけ持つ</div>
    </details>
  </div>

</div></div>

<!-- ============ 計画 ============ -->
<div class="page" id="pgPlan"><div class="wrap">
  <div class="card">
    <h2>この期間のルール</h2>
    <table id="tblPeriod"></table>
  </div>
  <div class="card">
    <h2>固定給と上限</h2>
    <div class="scroll"><table id="tblFix"></table></div>
  </div>
  <div class="card">
    <h2>勉強歩合の単価（累進）</h2>
    <div class="scroll"><table id="tblTier"></table></div>
    <div class="note" style="margin-top:8px">超過累進。しきい値を超えた<b>分だけ</b>高い単価が適用される。長くやるほど1時間の価値が上がる</div>
  </div>
  <div class="card" id="cardBoost">
    <h2>日次ブースト（長期休みルール）</h2>
    <div class="scroll"><table id="tblBoost"></table></div>
    <div class="note" style="margin-top:8px">その日の勉強時間が閾値を超えるたびに加算。月の合計とは<b>別枠</b>で計算する。まとめて集中した日が評価される</div>
  </div>
  <div class="card">
    <h2>満額に必要な勉強量</h2>
    <div class="scroll"><table id="tblMax"></table></div>
  </div>
  <div class="card">
    <h2>約束ごと</h2>
    <div class="note" id="rules"></div>
  </div>
</div></div>

<div class="tabs">
  <button class="on" id="tbHome" onclick="tab('Home')"><i>💰</i>実績</button>
  <button id="tbPlan" onclick="tab('Plan')"><i>📋</i>計画</button>
</div>

<div class="modal" id="modal"><div class="box">
  <div id="mdTx" style="font-size:14px;margin-bottom:14px"></div>
  <button class="btn dgr" id="mdOk">実行する</button>
  <button class="btn sec" onclick="closeModal()">やめる</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   設定
   - KIDS_META : 子どもの固定情報（期間によらない）
   - PERIODS   : 月ごとのパラメータ。新しい月はここに1つ足すだけ
   ========================================================= */
const KIDS_META = {
  yume: { name:'結愛', grade:'高2', color:'var(--yume)', hex:'#f472b6' },
  yuki: { name:'結輝', grade:'中2', color:'var(--yuki)', hex:'#38bdf8' }
};
const KEYS = Object.keys(KIDS_META);

const RULES_BASE = [
  '計上は15分（0.25時間）単位。1回15分未満は数えない',
  '「ながら勉強」は計上しない。スマホは別室に置く',
  '学校の授業・塾の授業時間は含めない',
  '記録は本人がつける。虚偽の申告があった月は歩合ゼロ',
  '月末締め、支給は毎月末',
  '固定給・単価・閾値は一度決めたら下げない（＝同じ勉強時間でもらえる額は減らない）',
  '増額は「固定給を上げる」「単価を上げる」「上限を上げる」「支給項目を足す」のいずれか'
];

const PERIODS = [
  {
    id: '2026-08',
    label: '2026年8月',
    mode: '長期休みVer',
    start: '2026-08-15',
    end:   '2026-08-31',
    payday:'8/31（月末）',
    days:  17,
    prorate:'17/31（月の途中開始のため日割り）',
    dailyMax: 8,
    presets: [1,2,3,4,5,6],
    kids: {
      yume: { fixed:1100,
              tiers:[ {upto:16,rate:60}, {upto:27,rate:90}, {upto:null,rate:120} ],
              studyCap:4300,
              boost:[ {thr:3,amt:80}, {thr:4,amt:80}, {thr:6,amt:100} ], boostCap:2100 },
      yuki: { fixed:660,
              tiers:[ {upto:11,rate:50}, {upto:19,rate:70}, {upto:null,rate:90} ],
              studyCap:2800,
              boost:[ {thr:2,amt:60}, {thr:3,amt:60}, {thr:5,amt:80} ], boostCap:1600 }
    }
  },
  {
    id: '2026-09',
    label: '2026年9月',
    mode: '学期中Ver',
    start: '2026-09-01',
    end:   '2026-09-30',
    payday:'9/30（月末）',
    days:  30,
    prorate:'なし（本則）',
    dailyMax: 6,
    presets: [0.5,1,1.5,2,3,4],
    kids: {
      yume: { fixed:2000,
              tiers:[ {upto:30,rate:60}, {upto:50,rate:90}, {upto:null,rate:120} ],
              studyCap:5500,
              boost:[], boostCap:0 },
      yuki: { fixed:1200,
              tiers:[ {upto:20,rate:50}, {upto:35,rate:70}, {upto:null,rate:90} ],
              studyCap:3600,
              boost:[], boostCap:0 }
    }
  }
];

/* 選択中の期間 */
let PIDX = 0;
let CONFIG = null;
function applyPeriod(i){
  PIDX = Math.max(0, Math.min(PERIODS.length-1, i));
  const p = PERIODS[PIDX];
  CONFIG = JSON.parse(JSON.stringify(p));
  CONFIG.title = p.label + '分（' + p.mode + '）';
  CONFIG.rules = RULES_BASE.slice();
  CONFIG.rules.splice(2, 0, '1日' + p.dailyMax + '時間まで');
  for(const k of KEYS) Object.assign(CONFIG.kids[k], KIDS_META[k]);
  CONFIG.hasBoost = KEYS.some(k => CONFIG.kids[k].boostCap > 0);
}

const LS_DATA = 'study_earn_v2';
const LS_API  = 'study_earn_api';
const LS_PIDX = 'study_earn_period';

/* =========================================================
   計算ロジック
   ========================================================= */
// 超過累進の勉強歩合（上限適用前）
function studyPayRaw(H, tiers){
  let tot=0, prev=0;
  for(const t of tiers){
    const cap = (t.upto===null) ? H : Math.min(H, t.upto);
    if(cap>prev) tot += (cap-prev)*t.rate;
    prev = Math.max(prev, cap);
  }
  return tot;
}
// 現在の累計時間における「次の1時間」の単価
function marginalRate(H, tiers){
  for(const t of tiers){ if(t.upto===null || H < t.upto) return t.rate; }
  return tiers[tiers.length-1].rate;
}
// その日のブースト額
function dayBoost(d, steps){
  return steps.reduce((s,x)=> (d>=x.thr ? s+x.amt : s), 0);
}
// 10円単位で切り上げ
function ceil10(v){ return Math.ceil(v/10)*10; }

// 期間内の全記録から1人分の集計を作る
function calc(kid, records){
  const c = CONFIG.kids[kid];
  let hours=0, boostRaw=0;
  for(const [d,r] of Object.entries(records)){
    if(!inRange(d)) continue;
    const h = Number(r[kid])||0;
    if(h<=0) continue;
    hours += h;
    boostRaw += dayBoost(h, c.boost);
  }
  const sRaw  = studyPayRaw(hours, c.tiers);
  const study = Math.min(sRaw, c.studyCap);
  const boost = Math.min(boostRaw, c.boostCap);
  const total = c.fixed + study + boost;
  return {
    hours, sRaw, study, boostRaw, boost, total,
    payout: ceil10(total),
    fixed: c.fixed,
    studyCap: c.studyCap, boostCap: c.boostCap,
    max: c.fixed + c.studyCap + c.boostCap,
    nextRate: (sRaw >= c.studyCap) ? 0 : marginalRate(hours, c.tiers)
  };
}

/* =========================================================
   状態
   ========================================================= */
let DATA = {records:{}};
let API  = '';
let EDIT = null;

function inRange(d){ return d>=CONFIG.start && d<=CONFIG.end; }
function todayStr(){
  const t=new Date(); const z=n=>String(n).padStart(2,'0');
  return t.getFullYear()+'-'+z(t.getMonth()+1)+'-'+z(t.getDate());
}
function daysLeft(){
  const t=todayStr();
  if(t>CONFIG.end) return 0;
  const s = t<CONFIG.start ? CONFIG.start : t;
  return Math.round((new Date(CONFIG.end)-new Date(s))/86400000)+1;
}
function yen(v){ return Math.round(v).toLocaleString('ja-JP'); }
function hh(v){ return (Math.round(v*100)/100).toFixed(2).replace(/\.?0+$/,''); }
function wd(d){ return ['日','月','火','水','木','金','土'][new Date(d+'T00:00:00').getDay()]; }

/* =========================================================
   描画
   ========================================================= */
function render(){
  const sel=document.getElementById('selP');
  sel.innerHTML = PERIODS.map((p,i)=>
    `<option value="${i}"${i===PIDX?' selected':''}>${p.label}・${p.mode.replace('Ver','')} ${p.start.slice(5).replace('-','/')}-${p.end.slice(5).replace('-','/')}</option>`
  ).join('');
  document.getElementById('inputNote').textContent =
    `15分（0.25時間）単位。1日${CONFIG.dailyMax}時間まで。学校・塾の授業時間は含めない`;
  const fd=document.getElementById('fDate');
  fd.min=CONFIG.start; fd.max=CONFIG.end;
  for(const k of KEYS){
    const el=document.getElementById('f'+k[0].toUpperCase()+k.slice(1));
    if(el) el.max=CONFIG.dailyMax;
  }
  document.getElementById('cardBoost').style.display = CONFIG.hasBoost ? '' : 'none';

  // --- サマリーカード ---
  let html='';
  for(const k of KEYS){
    const c=CONFIG.kids[k], r=calc(k,DATA.records);
    const pS = Math.min(100, r.sRaw / c.studyCap*100);
    const pB = c.boostCap>0 ? Math.min(100, r.boostRaw / c.boostCap*100) : 0;
    html += `
    <div class="card kid" style="--c:${c.color}">
      <div class="kidhd">
        <span class="kidname">${c.name}</span>
        <span class="kidgrade">${c.grade}</span>
        <span style="margin-left:auto;font-size:11px;color:var(--tx3)">満額 ${yen(r.max)}円</span>
      </div>
      <div class="total">${yen(r.payout)}<small>円</small></div>
      <div class="tsub">支給見込み（${CONFIG.payday} 支給・10円単位切り上げ）</div>

      <div class="brk">
        <div class="brow"><span class="lb">固定給</span>
          <span class="cap">期間固定</span>
          <span class="vl">${yen(r.fixed)}円</span></div>

        <div class="brow"><span class="lb">勉強歩合</span>
          <span class="cap">${yen(r.sRaw)} / 上限 ${yen(c.studyCap)}</span>
          <span class="vl" style="color:${r.sRaw>=c.studyCap?'var(--warn)':'inherit'}">${yen(r.study)}円</span></div>
        <div class="bar"><i style="width:${pS}%;background:${c.color}"></i></div>

        ${ c.boostCap>0 ? `
        <div class="brow" style="margin-top:8px"><span class="lb">日次ブースト</span>
          <span class="cap">${yen(r.boostRaw)} / 上限 ${yen(c.boostCap)}</span>
          <span class="vl" style="color:${r.boostRaw>=c.boostCap?'var(--warn)':'inherit'}">${yen(r.boost)}円</span></div>
        <div class="bar"><i style="width:${pB}%;background:var(--ok)"></i></div>` : '' }
      </div>

      <div class="mini">
        <div><b>${hh(r.hours)}<span style="font-size:10px"> h</span></b><span>累計 勉強時間</span></div>
        <div><b>${hh(r.hours/CONFIG.days)}<span style="font-size:10px"> h</span></b><span>1日平均</span></div>
        <div><b>${daysLeft()}<span style="font-size:10px"> 日</span></b><span>残り</span></div>
      </div>

      <div class="next">
        ${ r.nextRate>0
           ? `いま追加で1時間やると <b>+${yen(r.nextRate)}円</b>　<span style="color:var(--tx3)">（勉強歩合の単価）</span>`
           : ( c.boostCap>0 && r.boost<c.boostCap
               ? `<span style="color:var(--warn)">勉強歩合は上限に到達。日次ブーストで${yen(c.boostCap-r.boost)}円ぶんまだ伸ばせる</span>`
               : `<span style="color:var(--warn)">この月は満額に到達。おつかれさま</span>` ) }
      </div>
    </div>`;
  }
  document.getElementById('cards').innerHTML = html;

  drawBar(); drawLine(); drawTable(); drawPlan();
}

/* --- 日別 棒グラフ --- */
function drawBar(){
  const days=[]; let d=new Date(CONFIG.start+'T00:00:00'); const e=new Date(CONFIG.end+'T00:00:00');
  while(d<=e){ const z=n=>String(n).padStart(2,'0');
    days.push(d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())); d.setDate(d.getDate()+1); }
  const W=Math.max(days.length*34+40, 320), H=170, pad={l:26,r:8,t:10,b:26};
  let max=CONFIG.dailyMax;
  const y=v=> pad.t + (H-pad.t-pad.b)*(1-v/max);
  let s=`<svg width="${W}" height="${H}">`;
  for(let g=0; g<=max; g+=2){
    s+=`<line x1="${pad.l}" y1="${y(g)}" x2="${W-pad.r}" y2="${y(g)}" stroke="#334155" stroke-width="1"/>`;
    s+=`<text x="2" y="${y(g)+4}" fill="#64748b" font-size="9">${g}h</text>`;
  }
  const bw=(W-pad.l-pad.r)/days.length;
  days.forEach((dt,i)=>{
    const x0=pad.l+bw*i, rec=DATA.records[dt]||{};
    const w=(bw-6)/2;
    const dow=new Date(dt+'T00:00:00').getDay();
    if(dow===0||dow===6) s+=`<rect x="${x0}" y="${pad.t}" width="${bw}" height="${H-pad.t-pad.b}" fill="#38bdf8" opacity=".05"/>`;
    KEYS.forEach((k,j)=>{
      const v=Number(rec[k])||0; if(v<=0) return;
      const col = KIDS_META[k].hex;
      s+=`<rect x="${x0+3+w*j}" y="${y(Math.min(v,max))}" width="${w}" height="${H-pad.b-y(Math.min(v,max))}" fill="${col}" rx="2"/>`;
    });
    if(dt===todayStr()) s+=`<circle cx="${x0+bw/2}" cy="${H-pad.b+9}" r="2.5" fill="#34d399"/>`;
    s+=`<text x="${x0+bw/2}" y="${H-pad.b+16}" fill="#64748b" font-size="9" text-anchor="middle">${dt.slice(8)}</text>`;
  });
  s+=`</svg>`;
  document.getElementById('chartBar').innerHTML=s;
}

/* --- 累計 折れ線 --- */
function drawLine(){
  const days=[]; let d=new Date(CONFIG.start+'T00:00:00'); const e=new Date(CONFIG.end+'T00:00:00');
  while(d<=e){ const z=n=>String(n).padStart(2,'0');
    days.push(d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())); d.setDate(d.getDate()+1); }
  const W=document.getElementById('chartLine').clientWidth||320, H=170, pad={l:38,r:8,t:10,b:24};
  const maxV=Math.max(...KEYS.map(k=>calc(k,DATA.records).max));
  const y=v=> pad.t+(H-pad.t-pad.b)*(1-v/maxV);
  const x=i=> pad.l+(W-pad.l-pad.r)*(days.length<2?0:i/(days.length-1));
  let s=`<svg width="${W}" height="${H}">`;
  for(let g=0; g<=maxV; g+=2000){
    s+=`<line x1="${pad.l}" y1="${y(g)}" x2="${W-pad.r}" y2="${y(g)}" stroke="#334155"/>`;
    s+=`<text x="2" y="${y(g)+4}" fill="#64748b" font-size="9">${g/1000}千</text>`;
  }
  for(const k of KEYS){
    const c=CONFIG.kids[k], col = KIDS_META[k].hex;
    s+=`<line x1="${pad.l}" y1="${y(c.fixed+c.studyCap+c.boostCap)}" x2="${W-pad.r}" y2="${y(c.fixed+c.studyCap+c.boostCap)}" stroke="${col}" stroke-dasharray="3 3" opacity=".45"/>`;
    let acc={}; let pts=[];
    days.forEach((dt,i)=>{
      acc[dt]=DATA.records[dt];
      const sub={}; days.slice(0,i+1).forEach(dd=>{ if(DATA.records[dd]) sub[dd]=DATA.records[dd]; });
      pts.push([x(i), y(calc(k,sub).total)]);
    });
    s+=`<polyline fill="none" stroke="${col}" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
  }
  s+=`</svg>`;
  document.getElementById('chartLine').innerHTML=s;
}

/* --- 記録一覧 --- */
function drawTable(){
  const ds=Object.keys(DATA.records).filter(inRange).sort().reverse();
  let s=`<thead><tr><th>日付</th>`;
  for(const k of KEYS){ const c=CONFIG.kids[k];
    s+=`<th class="n" style="color:${c.color}">${c.name}</th>`; }
  s+=`<th>メモ</th><th></th></tr></thead><tbody>`;
  if(!ds.length) s+=`<tr><td colspan="5" style="color:var(--tx3);text-align:center;padding:16px">まだ記録がありません</td></tr>`;
  for(const d of ds){
    const r=DATA.records[d], dow=new Date(d+'T00:00:00').getDay();
    const cls=(d===todayStr()?'today':(dow===0||dow===6?'we':''));
    s+=`<tr class="${cls}"><td>${d.slice(5).replace('-','/')}<span style="color:var(--tx3)">(${wd(d)})</span></td>`;
    for(const k of KEYS){
      const c=CONFIG.kids[k], h=Number(r[k])||0, b=dayBoost(h,c.boost);
      s+=`<td class="n">${h?hh(h)+'h':'—'}${b?`<br><span style="font-size:10px;color:var(--ok)">+${b}</span>`:''}</td>`;
    }
    s+=`<td style="color:var(--tx2);font-size:11px">${(r.memo||'').slice(0,14)}</td>`;
    s+=`<td style="white-space:nowrap"><span class="act" onclick="edit('${d}')">編集</span><span class="act" onclick="askDel('${d}')">削除</span></td></tr>`;
  }
  s+=`</tbody>`;
  document.getElementById('tbl').innerHTML=s;
}

/* --- 計画タブ --- */
function drawPlan(){
  document.getElementById('tblPeriod').innerHTML = `
    <tr><th>対象期間</th><td>${CONFIG.start} 〜 ${CONFIG.end}（${CONFIG.days}日間）</td></tr>
    <tr><th>締め・支給</th><td>月末締め／${CONFIG.payday} 支給</td></tr>
    <tr><th>日割り</th><td>${CONFIG.prorate}</td></tr>
    <tr><th>この期間の版</th><td>長期休みVer（日次ブーストあり）</td></tr>`;

  const bs=CONFIG.hasBoost;
  let s=`<thead><tr><th></th><th class="n">固定給</th><th class="n">勉強歩合<br>上限</th>${bs?'<th class="n">ブースト<br>上限</th>':''}<th class="n">満額</th></tr></thead><tbody>`;
  for(const k of KEYS){ const c=CONFIG.kids[k];
    s+=`<tr><td style="color:${c.color};font-weight:700">${c.name}</td>
        <td class="n">${yen(c.fixed)}</td><td class="n">${yen(c.studyCap)}</td>
        ${bs?`<td class="n">${yen(c.boostCap)}</td>`:''}<td class="n"><b>${yen(c.fixed+c.studyCap+c.boostCap)}</b></td></tr>`; }
  s+=`<tr><td style="color:var(--tx3)">2人合計</td><td class="n"></td><td class="n"></td>${bs?'<td class="n"></td>':''}
      <td class="n"><b>${yen(KEYS.reduce((a,k)=>{const c=CONFIG.kids[k];return a+c.fixed+c.studyCap+c.boostCap;},0))}</b></td></tr></tbody>`;
  document.getElementById('tblFix').innerHTML=s;

  s='';
  for(const k of KEYS){
    const c=CONFIG.kids[k];
    s+=`<thead><tr><th style="color:${c.color};font-size:13px;font-weight:700">${c.name}<span style="color:var(--tx3);font-weight:400"> ${c.grade}</span></th>
        <th class="n">単価</th><th class="n">この階層で<br>もらえる額</th></tr></thead><tbody>`;
    let prev=0;
    c.tiers.forEach((t,i)=>{
      const lbl = (t.upto===null) ? `${prev}h 超〜` : (i===0 ? `0h 〜 ${t.upto}h` : `${prev}h 超〜 ${t.upto}h`);
      const amt = (t.upto===null) ? '上限まで' : yen((t.upto-prev)*t.rate)+'円';
      s+=`<tr><td>${lbl}</td><td class="n" style="font-weight:600">${t.rate}円/h</td><td class="n" style="color:var(--tx3)">${amt}</td></tr>`;
      prev = t.upto || prev;
    });
    s+=`<tr><td colspan="2" style="color:var(--tx3)">勉強歩合の上限</td><td class="n" style="color:var(--warn);font-weight:600">${yen(c.studyCap)}円</td></tr>`;
    s+=`</tbody>`;
  }
  document.getElementById('tblTier').innerHTML=s;

  s=`<thead><tr><th>その日の勉強</th>`;
  for(const k of KEYS) s+=`<th class="n" style="color:${CONFIG.kids[k].color}">${CONFIG.kids[k].name}</th>`;
  s+=`</tr></thead><tbody>`;
  for(let d=1; d<=7; d++){
    s+=`<tr><td>${d}h${d===7?' 以上':''}</td>`;
    for(const k of KEYS){ const b=dayBoost(d,CONFIG.kids[k].boost);
      s+=`<td class="n" style="${b?'color:var(--ok);font-weight:600':'color:var(--tx3)'}">${b?'+'+b+'円':'—'}</td>`; }
    s+=`</tr>`;
  }
  s+=`</tbody>`;
  document.getElementById('tblBoost').innerHTML=s;

  s=`<thead><tr><th></th><th class="n">勉強歩合の<br>上限まで</th>${bs?'<th class="n">毎日ムラなく<br>満額</th><th class="n">集中型で<br>満額</th>':''}</tr></thead><tbody>`;
  for(const k of KEYS){
    const c=CONFIG.kids[k];
    let h=0; while(studyPayRaw(h,c.tiers)<c.studyCap) h+=0.25;
    let extra='';
    if(bs && c.boostCap>0){
      let dd=0, guard=0;
      while(guard++<200){ dd+=0.25; if(studyPayRaw(CONFIG.days*dd,c.tiers)>=c.studyCap && CONFIG.days*dayBoost(dd,c.boost)>=c.boostCap) break; }
      const perDayMax=c.boost.reduce((a,x)=>a+x.amt,0);
      const topThr=c.boost[c.boost.length-1].thr;
      const nDays=Math.ceil(c.boostCap/perDayMax);
      extra=`<td class="n">1日${hh(dd)}h</td>
             <td class="n">${topThr}h×${nDays}日<br><span style="font-size:10px;color:var(--tx3)">＝計${topThr*nDays}h</span></td>`;
    } else if(bs){ extra='<td class="n">—</td><td class="n">—</td>'; }
    s+=`<tr><td style="color:${c.color};font-weight:700">${c.name}</td>
        <td class="n">計${hh(h)}h<br><span style="font-size:10px;color:var(--tx3)">1日${hh(h/CONFIG.days)}h</span></td>
        ${extra}</tr>`;
  }
  s+=`</tbody>`;
  document.getElementById('tblMax').innerHTML=s;

  document.getElementById('rules').innerHTML = CONFIG.rules.map((r,i)=>`${i+1}. ${r}`).join('<br>');
}

/* =========================================================
   入力・保存
   ========================================================= */
function buildPresets(){
  for(const k of KEYS){
    const el=document.getElementById('pre'+k[0].toUpperCase()+k.slice(1));
    el.innerHTML = CONFIG.presets.map(v=>`<button type="button" onclick="setP('${k}',${v})">${v}h</button>`).join('');
  }
}
function setP(k,v){ document.getElementById('f'+k[0].toUpperCase()+k.slice(1)).value=v; }

function save(){
  const d=document.getElementById('fDate').value;
  if(!d){ toast('日付を入れて'); return; }
  if(!inRange(d)){ toast('この期間（'+CONFIG.start+'〜'+CONFIG.end+'）の日付だけ'); return; }
  const rec={memo:document.getElementById('fMemo').value.trim()};
  for(const k of KEYS){
    let v=Number(document.getElementById('f'+k[0].toUpperCase()+k.slice(1)).value)||0;
    if(v<0) v=0;
    if(v>CONFIG.dailyMax){ v=CONFIG.dailyMax; toast('1日'+CONFIG.dailyMax+'時間が上限'); }
    rec[k]=Math.round(v*4)/4;
  }
  DATA.records[d]=rec;
  persist(); render();
  push({action:'save', date:d, yume:rec.yume, yuki:rec.yuki, memo:rec.memo});
  document.getElementById('fMemo').value='';
  for(const k of KEYS) document.getElementById('f'+k[0].toUpperCase()+k.slice(1)).value='';
  toast('保存しました');
}
function edit(d){
  const r=DATA.records[d]; if(!r) return;
  document.getElementById('fDate').value=d;
  for(const k of KEYS) document.getElementById('f'+k[0].toUpperCase()+k.slice(1)).value=r[k]||'';
  document.getElementById('fMemo').value=r.memo||'';
  window.scrollTo({top:document.getElementById('cards').offsetHeight, behavior:'smooth'});
}
function askDel(d){ openModal(d+' の記録を削除する', ()=>{ delete DATA.records[d]; persist(); render(); push({action:'delete',date:d}); toast('削除しました'); }); }
function askReset(){ openModal('すべての記録を削除する。旧チャレンジ（ドル建て）の精算済みデータもまとめて消える。元に戻せない', ()=>{ DATA.records={}; persist(); render(); push({action:'reset'}); toast('全削除しました'); }); }

function openModal(tx, fn){
  document.getElementById('mdTx').textContent=tx;
  document.getElementById('modal').classList.add('on');
  document.getElementById('mdOk').onclick=()=>{ fn(); closeModal(); };
}
function closeModal(){ document.getElementById('modal').classList.remove('on'); }

/* =========================================================
   同期（既存GAS API互換）
   ========================================================= */
function setPill(st){
  const m={ok:'🟢 同期済み',sync:'🟡 同期中…',off:'🔴 オフライン',local:'⚙️ 未接続'};
  document.getElementById('pill').textContent=m[st]||m.local;
}
function persist(){ try{ localStorage.setItem(LS_DATA, JSON.stringify(DATA)); }catch(e){} }

async function pull(){
  if(!API){ setPill('local'); return; }
  setPill('sync');
  try{
    const res=await fetch(API, {method:'GET'});
    const j=await res.json();
    if(j.ok){ DATA.records=j.records||{}; persist(); render(); setPill('ok'); }
    else setPill('off');
  }catch(e){ setPill('off'); }
}
async function push(body){
  if(!API){ setPill('local'); return; }
  setPill('sync');
  try{
    const res=await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
    const j=await res.json();
    if(j.ok){ DATA.records=j.records||{}; persist(); render(); setPill('ok'); }
    else setPill('off');
  }catch(e){ setPill('off'); }
}
function connect(){
  const u=document.getElementById('fApi').value.trim();
  if(!/^https:\/\/script\.google\.com\/.*\/exec$/.test(u)){ toast('/exec で終わるURLを入れて'); return; }
  API=u; localStorage.setItem(LS_API,u); pull(); toast('接続しました');
}
function resync(){ pull(); }
function exportJson(){
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='study_earn_'+todayStr()+'.json'; a.click();
}

/* =========================================================
   その他
   ========================================================= */
function tab(n){
  for(const t of ['Home','Plan']){
    document.getElementById('pg'+t).classList.toggle('on', t===n);
    document.getElementById('tb'+t).classList.toggle('on', t===n);
  }
  if(n==='Home') drawLine();
  window.scrollTo(0,0);
}
let tmr;
function toast(m){
  const el=document.getElementById('toast');
  el.textContent=m; el.classList.add('on');
  clearTimeout(tmr); tmr=setTimeout(()=>el.classList.remove('on'),1800);
}

function pickPeriodForToday(){
  const t=todayStr();
  for(let i=0;i<PERIODS.length;i++){ if(t>=PERIODS[i].start && t<=PERIODS[i].end) return i; }
  // 今日がどの期間にも入らない場合は、today を過ぎていない最も早い期間／無ければ最後の期間
  for(let i=0;i<PERIODS.length;i++){ if(t<PERIODS[i].start) return i; }
  return PERIODS.length-1;
}
function syncDateField(){
  const f=document.getElementById('fDate');
  const t=todayStr();
  f.value = (t<CONFIG.start)?CONFIG.start : (t>CONFIG.end)?CONFIG.end : t;
}
function changePeriod(i){
  applyPeriod(i);
  try{ localStorage.setItem(LS_PIDX, String(PIDX)); }catch(e){}
  buildPresets();
  syncDateField();
  render();
  toast(CONFIG.title + ' に切替');
}

(function init(){
  try{ const c=localStorage.getItem(LS_DATA); if(c) DATA=JSON.parse(c); }catch(e){}
  if(!DATA.records) DATA.records={};
  API = localStorage.getItem(LS_API) || '';
  document.getElementById('fApi').value=API;

  let idx=pickPeriodForToday();
  try{
    const saved=localStorage.getItem(LS_PIDX);
    const t=todayStr();
    // 保存された選択は「今日がどの期間にも入っていないとき」だけ尊重する
    if(saved!==null && !PERIODS.some(p=>t>=p.start&&t<=p.end)){
      const n=parseInt(saved,10);
      if(!isNaN(n) && n>=0 && n<PERIODS.length) idx=n;
    }
  }catch(e){}
  applyPeriod(idx);

  buildPresets();
  syncDateField();
  render();
  if(API) pull(); else setPill('local');
  window.addEventListener('resize', ()=>drawLine());
})();
</script>
